name: analysis
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.13.5
  - numpy=2.2.6
  - scipy=1.16.0
  - pandas=2.3.1
  - matplotlib=3.10.0
  - pip
  - pip:
      - nibabel==5.3.2
      - nilearn==0.12.0
      - nipype==1.10.0
      - scikit-learn==1.7.0
      - statsmodels==0.14.5
      - neuromaps
      - setuptools
      - netneurotools
      - brainsmash
# NOTE: GLMsingle (and its dependency fracridge) are required ONLY to regenerate
# beta maps from raw data (analysis/GLM/surfaceGLMsingle.py). They are NOT needed
# to run the demos or the main analyses, which use precomputed beta maps.
# GLMsingle is not on PyPI; install it (with fracridge) separately from GitHub:
#   pip install git+https://github.com/cvnlab/GLMsingle.git